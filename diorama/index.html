<style>

<script>
// If the controls fail to start on a browser, say so on the page (with the reason) rather
// than leaving only the model.
(() => {
  let why = '';
  addEventListener('error', (e) => { why ||= e.message || String(e.error || ''); });
  addEventListener('unhandledrejection', (e) => { why ||= String(e.reason?.message || e.reason || ''); });
  const check = () => {
    if (document.getElementById('ui') || !document.body.classList.contains('ready')) return;
    const n = document.createElement('div'); n.className = 'fail';
    n.textContent = "The controls didn't load on this browser. Reload to try again." + (why ? ' (' + why + ')' : '');
    document.body.appendChild(n);
  };
  setTimeout(check, 45000);
})();
</script>
